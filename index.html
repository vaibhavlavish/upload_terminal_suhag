<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Suhag Jewellers — Item Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --oxblood: #3B0E17;
      --oxblood-deep: #2A0A10;
      --gold: #C6A15B;
      --gold-soft: #E7C9A9;
      --ivory: #FBF6EE;
      --ink: #2A2420;
      --ink-soft: #6b6058;
      --ok: #3E8E52;
      --err: #B23B3B;
      --light-border: #EEE3CC;
      --hover-bg: #F7F2E7;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--ivory);
      color: var(--ink);
      font-family: 'Work Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* ========== HEADER ========== */
    header {
      background: linear-gradient(180deg, var(--oxblood), var(--oxblood-deep));
      color: var(--ivory);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 56px;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--ivory);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ========== MAIN CONTAINER ========== */
    .container {
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* ========== DESKTOP LAYOUT ========== */
    .desktop-view {
      display: none;
      flex: 1;
      overflow: hidden;
    }

    @media (min-width: 1024px) {
      .desktop-view {
        display: flex;
      }

      .mobile-view {
        display: none !important;
      }
    }

    .sidebar {
      width: 220px;
      background: #fff;
      border-right: 1px solid var(--light-border);
      overflow-y: auto;
      padding: 16px 0;
      flex-shrink: 0;
    }

    .sidebar-section {
      margin-bottom: 20px;
      padding: 0 12px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    .sidebar-item {
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 4px;
      transition: all 0.2s;
      color: var(--ink);
    }

    .sidebar-item:hover {
      background: var(--hover-bg);
    }

    .sidebar-item.active {
      background: var(--oxblood);
      color: var(--ivory);
      font-weight: 600;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid var(--light-border);
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .search-box {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid var(--light-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Work Sans', sans-serif;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--gold);
    }

    .items-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .item-card {
      background: #fff;
      border: 1.5px solid var(--light-border);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .item-card:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 12px rgba(198, 161, 91, 0.15);
      transform: translateY(-2px);
    }

    .item-image {
      width: 100%;
      aspect-ratio: 1/1;
      background: var(--hover-bg);
      border-radius: 6px;
      object-fit: cover;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 12px;
      font-weight: 600;
      margin: 0 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-price {
      font-size: 13px;
      font-weight: 700;
      color: #2E7D46;
      margin: 0;
    }

    .editor-panel {
      width: 0;
      background: #fff;
      border-left: 1px solid var(--light-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease;
      flex-shrink: 0;
    }

    .editor-panel.open {
      width: 400px;
    }

    .editor-header {
      padding: 16px;
      border-bottom: 1px solid var(--light-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-header h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .editor-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .editor-field {
      margin-bottom: 12px;
    }

    .editor-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .editor-field input,
    .editor-field select,
    .editor-field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid var(--light-border);
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Work Sans', sans-serif;
      outline: none;
    }

    .editor-field input:focus,
    .editor-field select:focus,
    .editor-field textarea:focus {
      border-color: var(--gold);
    }

    .editor-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--light-border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .editor-footer button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-btn {
      background: var(--oxblood);
      color: var(--ivory);
    }

    .delete-btn {
      background: var(--err);
      color: var(--ivory);
    }

    .close-btn {
      background: var(--hover-bg);
      color: var(--ink);
    }

    /* ========== MOBILE LAYOUT ========== */
    .mobile-view {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    @media (min-width: 1024px) {
      .mobile-view {
        display: none !important;
      }
    }

    .mobile-search {
      padding: 12px;
      background: #fff;
      border-bottom: 1px solid var(--light-border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .mobile-search input {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--light-border);
      border-radius: 20px;
      font-size: 14px;
      font-family: 'Work Sans', sans-serif;
      outline: none;
    }

    .mobile-search input:focus {
      border-color: var(--gold);
    }

    .mobile-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      padding-bottom: 68px;
    }

    .mobile-item {
      background: #fff;
      border: 1px solid var(--light-border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      gap: 10px;
      touch-action: pan-y;
    }

    .mobile-item-image {
      width: 60px;
      height: 60px;
      background: var(--hover-bg);
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .mobile-item-info {
      flex: 1;
    }

    .mobile-item-name {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 4px;
    }

    .mobile-item-price {
      font-size: 13px;
      font-weight: 700;
      color: #2E7D46;
      margin: 0;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #fff;
      border-top: 1px solid var(--light-border);
      display: flex;
      justify-content: space-around;
      z-index: 20;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--ink-soft);
      font-size: 12px;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
    }

    .nav-item.active {
      color: var(--oxblood);
    }

    .nav-icon {
      font-size: 22px;
    }

    /* Mobile Sheet */
    .mobile-sheet {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 30;
      animation: fadeIn 0.2s;
    }

    .mobile-sheet.show {
      display: flex;
      align-items: flex-end;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .mobile-sheet-content {
      background: #fff;
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .mobile-sheet-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-soft);
    }

    .empty-state p {
      margin: 0;
      font-size: 14px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #D0C4B0;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #C0B0A0;
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>📋 Suhag Item Manager</h1>
  <button class="header-btn" id="logoutBtn">⚙️</button>
</header>

<!-- MAIN CONTAINER -->
<div class="container">
  
  <!-- DESKTOP VIEW -->
  <div class="desktop-view">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <input type="text" placeholder="Search..." id="searchInput" style="width: calc(100% - 24px); padding: 8px 12px; border: 1.5px solid var(--light-border); border-radius: 8px; font-size: 13px; margin: 0 12px 8px;">
      </div>

      <div class="sidebar-section">
        <p class="sidebar-title">Status</p>
        <div class="sidebar-item active" data-filter="all">All Items (457)</div>
        <div class="sidebar-item" data-filter="pending">Pending Photos (8)</div>
        <div class="sidebar-item" data-filter="incomplete">Incomplete (5)</div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-title">By Category</p>
        <div class="sidebar-item" data-category="all">All Categories</div>
        <div class="sidebar-item" data-category="silver">Silver Bracelet (45)</div>
        <div class="sidebar-item" data-category="gold">Gold Ring (67)</div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="desktopSearch" placeholder="Search items...">
        </div>
      </div>

      <div class="items-container" id="itemsContainer">
        <div class="empty-state">
          <p>📦 No items found</p>
        </div>
      </div>
    </div>

    <!-- Editor Panel -->
    <div class="editor-panel" id="editorPanel">
      <div class="editor-header">
        <h2 id="editorTitle">Item Details</h2>
        <button class="header-btn" id="closeEditorBtn" style="width: 30px; height: 30px; background: var(--hover-bg); color: var(--ink);">✕</button>
      </div>

      <div class="editor-content">
        <div class="editor-field">
          <label>Product Name</label>
          <input type="text" id="editName" placeholder="Name">
        </div>

        <div class="editor-field">
          <label>Category</label>
          <select id="editCategory">
            <option value="silver">Silver</option>
            <option value="gold">Gold</option>
            <option value="diamond">Diamond</option>
          </select>
        </div>

        <div class="editor-field">
          <label>Price (₹)</label>
          <input type="number" id="editPrice" placeholder="Price">
        </div>

        <div class="editor-field">
          <label>Status</label>
          <select id="editStatus">
            <option value="complete">Complete</option>
            <option value="pending">Pending Photos</option>
            <option value="incomplete">Incomplete</option>
          </select>
        </div>
      </div>

      <div class="editor-footer">
        <button class="save-btn" id="saveBtn">✓ Save</button>
        <button class="delete-btn" id="deleteBtn">🗑 Delete</button>
        <button class="close-btn" id="closeBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- MOBILE VIEW -->
  <div class="mobile-view">
    <div class="mobile-search">
      <input type="text" id="mobileSearch" placeholder="Find item...">
    </div>

    <div class="mobile-items" id="mobileItemsContainer">
      <div class="empty-state">
        <p>📦 No items</p>
      </div>
    </div>

    <!-- Mobile Sheet -->
    <div class="mobile-sheet" id="mobileSheet">
      <div class="mobile-sheet-content">
        <div class="mobile-sheet-title">
          <span>Edit Item</span>
          <button class="header-btn" id="closeMobileSheetBtn" style="width: 30px; height: 30px; background: var(--hover-bg); color: var(--ink);">✕</button>
        </div>

        <div class="editor-field">
          <label>Price (₹)</label>
          <input type="number" id="mobileEditPrice" placeholder="Price">
        </div>

        <div class="editor-field">
          <label>Category</label>
          <select id="mobileEditCategory">
            <option value="silver">Silver</option>
            <option value="gold">Gold</option>
            <option value="diamond">Diamond</option>
          </select>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button class="close-btn" id="closeMobileBtn" style="flex: 1; padding: 10px; border: none; border-radius: 8px;">Cancel</button>
          <button class="save-btn" id="saveMobileBtn" style="flex: 1; padding: 10px; border: none; border-radius: 8px; color: var(--ivory);">✓ Save</button>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-section="items">
        <span class="nav-icon">📋</span>
        <span>Items</span>
      </button>
      <button class="nav-item" data-section="upload">
        <span class="nav-icon">📷</span>
        <span>Upload</span>
      </button>
      <button class="nav-item" data-section="search">
        <span class="nav-icon">🔍</span>
        <span>Search</span>
      </button>
      <button class="nav-item" data-section="groups">
        <span class="nav-icon">🏷️</span>
        <span>Groups</span>
      </button>
      <button class="nav-item" data-section="account">
        <span class="nav-icon">👤</span>
        <span>Account</span>
      </button>
    </nav>
  </div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>

<script>
// Firebase Configuration (from your existing project)
const firebaseConfig = {
  apiKey: "AIzaSyDaRjbdCnfx5-C4OXQaByZMxK2r0Cu19bI",
  authDomain: "suhag-f53e4.firebaseapp.com",
  databaseURL: "https://suhag-f53e4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suhag-f53e4",
  storageBucket: "suhag-f53e4.firebasestorage.app",
  messagingSenderId: "231258063675",
  appId: "1:231258063675:web:1c79c2a0d4d5796a6d2d1e"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();
const auth = firebase.auth();

// State
let allItems = [];
let filteredItems = [];
let currentEditingItem = null;

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  initializeEventListeners();
  loadMockData();
  renderItems();
});

function initializeEventListeners() {
  // Desktop
  document.getElementById('desktopSearch').addEventListener('input', handleSearch);
  document.getElementById('closeEditorBtn').addEventListener('click', closeEditor);
  document.getElementById('closeBtn').addEventListener('click', closeEditor);
  document.getElementById('saveBtn').addEventListener('click', saveItem);
  document.getElementById('deleteBtn').addEventListener('click', deleteItem);

  // Mobile
  document.getElementById('mobileSearch').addEventListener('input', handleSearch);
  document.getElementById('closeMobileSheetBtn').addEventListener('click', closeMobileSheet);
  document.getElementById('closeMobileBtn').addEventListener('click', closeMobileSheet);
  document.getElementById('saveMobileBtn').addEventListener('click', saveMobileItem);

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', logout);
}

function handleSearch(e) {
  const term = e.target.value.toLowerCase();
  filteredItems = allItems.filter(item =>
    item.name.toLowerCase().includes(term) ||
    item.id.toLowerCase().includes(term)
  );
  renderItems();
}

function renderItems() {
  // Desktop
  const container = document.getElementById('itemsContainer');
  if (filteredItems.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>📦 No items found</p></div>';
  } else {
    container.innerHTML = filteredItems.map(item => `
      <div class="item-card" onclick="editItem('${item.id}')">
        ${item.images?.[0] ? `<img src="${item.images[0]}" class="item-image" alt="">` : '<div class="item-image"></div>'}
        <h3 class="item-name">${item.name}</h3>
        <p class="item-price">₹${item.price?.toLocaleString() || 0}</p>
      </div>
    `).join('');
  }

  // Mobile
  const mobileContainer = document.getElementById('mobileItemsContainer');
  if (filteredItems.length === 0) {
    mobileContainer.innerHTML = '<div class="empty-state"><p>📦 No items</p></div>';
  } else {
    mobileContainer.innerHTML = filteredItems.map(item => `
      <div class="mobile-item" onclick="editMobileItem('${item.id}')">
        ${item.images?.[0] ? `<img src="${item.images[0]}" class="mobile-item-image" alt="">` : '<div class="mobile-item-image"></div>'}
        <div class="mobile-item-info">
          <h3 class="mobile-item-name">${item.name}</h3>
          <p class="mobile-item-price">₹${item.price?.toLocaleString() || 0}</p>
        </div>
      </div>
    `).join('');
  }
}

function editItem(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;

  currentEditingItem = item;
  document.getElementById('editorTitle').textContent = item.name || 'Item Details';
  document.getElementById('editName').value = item.name || '';
  document.getElementById('editPrice').value = item.price || '';
  document.getElementById('editorPanel').classList.add('open');
}

function editMobileItem(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;

  currentEditingItem = item;
  document.getElementById('mobileEditPrice').value = item.price || '';
  document.getElementById('mobileSheet').classList.add('show');
}

function closeEditor() {
  document.getElementById('editorPanel').classList.remove('open');
  currentEditingItem = null;
}

function closeMobileSheet() {
  document.getElementById('mobileSheet').classList.remove('show');
  currentEditingItem = null;
}

function saveItem() {
  if (!currentEditingItem) return;
  currentEditingItem.name = document.getElementById('editName').value;
  currentEditingItem.price = parseInt(document.getElementById('editPrice').value) || 0;
  // TODO: Save to Firebase
  alert('✓ Saved!');
  closeEditor();
  renderItems();
}

function saveMobileItem() {
  if (!currentEditingItem) return;
  currentEditingItem.price = parseInt(document.getElementById('mobileEditPrice').value) || 0;
  // TODO: Save to Firebase
  alert('✓ Saved!');
  closeMobileSheet();
  renderItems();
}

function deleteItem() {
  if (!currentEditingItem) return;
  if (!confirm('Delete this item?')) return;
  allItems = allItems.filter(i => i.id !== currentEditingItem.id);
  closeEditor();
  renderItems();
}

function logout() {
  auth.signOut().then(() => {
    window.location.href = 'login.html';
  });
}

function loadMockData() {
  allItems = [
    { id: 'ABC-123', name: 'Silver Bangle', category: 'silver', price: 5500, images: [] },
    { id: 'ABC-124', name: 'Gold Ring', category: 'gold', price: 8000, images: [] },
    { id: 'ABC-125', name: 'Diamond Pendant', category: 'diamond', price: 12000, images: [] }
  ];
  filteredItems = [...allItems];
}
</script>

</body>
</html>
