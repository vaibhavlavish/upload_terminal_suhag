<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suhag Jewellers — Item Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --oxblood:#3B0E17; --oxblood-deep:#2A0A10; --gold:#C6A15B; --gold-soft:#E7C9A9;
    --ivory:#FBF6EE; --ink:#2A2420; --ink-soft:#6b6058;
    --ok:#3E8E52; --err:#B23B3B; --warn:#C49E3E;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--ivory); color:var(--ink);
    font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased;
  }

  /* ━━━ HEADER ━━━ */
  .header{
    background:linear-gradient(180deg, var(--oxblood), var(--oxblood-deep));
    color:var(--ivory); padding:16px 20px; display:flex; align-items:center; gap:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
  }
  .header h1{margin:0; font-size:18px; font-weight:700; flex:1;}
  .header-icons{display:flex; gap:8px;}
  .header-btn{
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:8px;
    padding:8px 12px; color:var(--ivory); cursor:pointer; font-size:12px; font-weight:600;
  }
  .header-btn:active{background:rgba(255,255,255,.15);}

  /* ━━━ MAIN LAYOUT ━━━ */
  .main-layout{display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 56px);}
  
  /* ━━━ SIDEBAR ━━━ */
  .sidebar{
    background:#fff; border-right:1px solid #EEE3CC; overflow-y:auto;
    padding:16px 0; display:flex; flex-direction:column; gap:16px;
  }

  .sidebar-section{padding:0 12px;}
  .sidebar-section h3{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); margin:12px 0 8px; padding:0 8px;
  }

  .search-box{
    padding:0 12px; margin-bottom:8px;
  }
  .search-box input{
    width:100%; padding:10px 12px; border:1.5px solid #E6DCCB; border-radius:8px;
    font-size:13px; font-family:'Work Sans',sans-serif; outline:none;
  }
  .search-box input:focus{border-color:var(--gold);}

  .filter-chip{
    display:block; width:100%; text-align:left; padding:8px 12px; margin-bottom:6px;
    border:1px solid #E6DCCB; border-radius:8px; background:#fff; font-size:13px;
    cursor:pointer; color:var(--ink-soft); transition:all .2s;
  }
  .filter-chip.active{
    background:var(--oxblood); border-color:var(--oxblood); color:var(--ivory); font-weight:600;
  }
  .filter-chip:active{transform:scale(.98);}
  .filter-badge{
    display:inline-block; font-size:11px; background:rgba(198,161,91,.15);
    color:var(--gold); border-radius:999px; padding:2px 7px; margin-left:6px;
  }

  .mode-tabs{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:0 12px;}
  .mode-tab{
    padding:9px 0; text-align:center; border-radius:7px; border:1.5px solid #E6DCCB;
    background:#fff; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer;
  }
  .mode-tab.active{background:var(--oxblood); border-color:var(--oxblood); color:var(--ivory);}

  /* ━━━ CONTENT AREA ━━━ */
  .content{
    display:flex; flex-direction:column; background:#F9F7F1;
  }

  .toolbar{
    background:#fff; padding:12px 16px; border-bottom:1px solid #EEE3CC;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .toolbar-left{display:flex; gap:8px; align-items:center;}
  .toolbar-right{display:flex; gap:8px;}

  .view-toggle{
    display:flex; gap:4px;
  }
  .view-btn{
    padding:6px 10px; border:1px solid #E6DCCB; background:#fff;
    border-radius:6px; font-size:12px; cursor:pointer; color:var(--ink-soft);
  }
  .view-btn.active{background:var(--oxblood); color:var(--ivory); border-color:var(--oxblood);}

  .stat-pill{
    font-size:12px; color:var(--ink-soft); background:#E8E2D0; padding:6px 12px;
    border-radius:999px;
  }

  /* ━━━ GRID AREA ━━━ */
  .grid-container{
    flex:1; overflow-y:auto; padding:16px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px;
  }

  .item-card{
    background:#fff; border:1.5px solid #EEE3CC; border-radius:11px; overflow:hidden;
    cursor:pointer; transition:all .2s;
  }
  .item-card:active{border-color:var(--gold); box-shadow:0 2px 8px rgba(198,161,91,.15);}
  
  .item-thumb{
    aspect-ratio:1/1; background:#F0EAD9; overflow:hidden; position:relative;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  
  .item-meta{
    padding:10px; font-size:12px;
  }
  .item-barcode{font-weight:700; color:var(--ink); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-name{color:var(--ink-soft); font-size:11px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .item-status{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .status-label{
    font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px;
    background:var(--ok); color:#fff;
  }
  .status-label.warn{background:var(--warn); color:#fff;}
  .status-label.err{background:var(--err); color:#fff;}

  /* ━━━ SIDE PANEL (EDITOR) ━━━ */
  .side-panel{
    position:fixed; right:0; top:56px; width:320px; height:calc(100vh - 56px);
    background:#fff; border-left:1.5px solid #E6DCCB; box-shadow:-2px 0 12px rgba(0,0,0,.08);
    display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s ease;
    z-index:30;
  }
  .side-panel.open{transform:translateX(0);}

  .panel-header{
    padding:16px; border-bottom:1px solid #EEE3CC; display:flex; align-items:center; justify-content:space-between;
  }
  .panel-header h2{margin:0; font-size:15px; font-weight:700;}
  .panel-close{
    background:none; border:1px solid #E6DCCB; border-radius:6px; width:28px; height:28px;
    font-size:13px; cursor:pointer; color:var(--ink-soft);
  }
  .panel-close:active{background:#F3ECDA;}

  .panel-content{
    flex:1; overflow-y:auto; padding:16px;
  }

  .field-group{margin-bottom:16px;}
  .field-label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.3px; color:var(--ink-soft); margin-bottom:6px;
  }
  .field-input, .field-textarea, .field-select{
    width:100%; padding:10px 12px; border:1.5px solid #E6DCCB; border-radius:8px;
    font-size:13px; font-family:'Work Sans',sans-serif; outline:none;
  }
  .field-input:focus, .field-textarea:focus, .field-select:focus{border-color:var(--gold);}
  .field-textarea{min-height:80px; resize:vertical;}

  .photo-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:12px;
  }
  .photo-card{
    aspect-ratio:1/1; border:1.5px solid #E6DCCB; border-radius:8px; overflow:hidden;
    background:#F0EAD9; position:relative; cursor:pointer;
  }
  .photo-card img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-delete{
    position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
    background:var(--err); color:#fff; border:none; font-size:11px; cursor:pointer;
  }
  .photo-delete:active{opacity:.8;}
  .photo-badge{
    position:absolute; bottom:4px; left:4px; background:var(--gold); color:var(--ink);
    font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px;
  }

  .upload-area{
    border:2px dashed #D8CBA9; border-radius:10px; padding:16px; text-align:center;
    background:#FBF6EE; cursor:pointer; transition:all .2s;
  }
  .upload-area:active{border-color:var(--gold); background:#F3ECDA;}
  .upload-area p{margin:0 0 6px; font-size:12px; color:var(--ink-soft);}
  .upload-hint{font-size:11px; color:var(--ink-soft);}

  .panel-actions{
    padding:12px 16px; border-top:1px solid #EEE3CC; display:flex; gap:8px;
  }
  .btn{
    flex:1; padding:11px 0; border:none; border-radius:8px; font-size:13px; font-weight:700;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-primary{background:var(--oxblood); color:var(--ivory);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{background:#EEE; color:var(--ink);}
  .btn-secondary:active{transform:scale(.98);}
  .btn-danger{background:var(--err); color:#fff;}
  .btn-danger:active{opacity:.9;}

  /* ━━━ UPLOAD MODE STYLES ━━━ */
  .mode-view{display:none;}
  .mode-view.active{display:flex; flex-direction:column;}

  .scan-box{
    background:#111; border-radius:12px; overflow:hidden; aspect-ratio:3/4;
    position:relative; display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .scan-box video{width:100%; height:100%; object-fit:cover;}
  .scan-frame{
    position:absolute; inset:14% 10%; border:2.5px solid var(--gold);
    border-radius:8px; box-shadow:0 0 0 1000px rgba(0,0,0,.35); pointer-events:none;
  }
  .scan-hint{
    position:absolute; bottom:12px; left:0; right:0; text-align:center;
    color:#fff; font-size:12px; background:rgba(0,0,0,.4); padding:6px 0;
  }

  .bulk-upload-list{
    background:#fff; border:1px solid #EEE3CC; border-radius:10px; overflow:hidden;
    max-height:300px; overflow-y:auto;
  }
  .upload-item{
    padding:10px 12px; border-bottom:1px solid #F3ECDA; font-size:12px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .upload-item:last-child{border-bottom:none;}
  .upload-name{flex:1; overflow:hidden; text-overflow:ellipsis;}
  .upload-status{font-size:10px; font-weight:700; padding:2px 7px; border-radius:4px; background:var(--ok); color:#fff;}
  .upload-status.pending{background:#FFF3D6; color:#8A6A2E;}

  /* ━━━ RESPONSIVE ━━━ */
  @media (max-width:900px){
    .main-layout{grid-template-columns:1fr;}
    .sidebar{
      position:fixed; left:0; top:56px; width:240px; height:calc(100vh - 56px);
      transform:translateX(-100%); transition:transform .3s ease; z-index:20;
      box-shadow:2px 0 12px rgba(0,0,0,.1);
    }
    .sidebar.open{transform:translateX(0);}
    .grid-container{margin-left:0;}
    .side-panel{width:100%; left:0; right:auto;}
  }

  @media (max-width:600px){
    .header{padding:12px 16px;}
    .header h1{font-size:16px;}
    .grid-container{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; padding:12px;}
    .toolbar{flex-wrap:wrap;}
    .stat-pill{display:none;}
    .sidebar-section h3{display:none;}
  }

  .empty-state{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--ink-soft); text-align:center; padding:40px 20px;
  }
  .empty-state p{margin:0; font-size:13px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>📦 Item Manager</h1>
  <div class="header-icons">
    <button class="header-btn" id="sidebar-toggle" style="display:none;">Menu</button>
    <button class="header-btn" id="sync-status">Syncing…</button>
  </div>
</div>

<!-- MAIN LAYOUT -->
<div class="main-layout">
  
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search barcode, name…">
    </div>

    <div class="sidebar-section">
      <h3>Mode</h3>
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="browse">📋 Browse</button>
        <button class="mode-tab" data-mode="upload">📤 Upload</button>
      </div>
    </div>

    <div class="sidebar-section" id="filters-section">
      <h3>Status</h3>
      <button class="filter-chip active" data-filter="all">All Items</button>
      <button class="filter-chip" data-filter="missing-photos">Missing Photos <span class="filter-badge">0</span></button>
      <button class="filter-chip" data-filter="incomplete-desc">Incomplete Description <span class="filter-badge">0</span></button>
      <button class="filter-chip" data-filter="edited-today">Edited Today <span class="filter-badge">0</span></button>
      <button class="filter-chip" data-filter="new-week">New This Week <span class="filter-badge">0</span></button>
    </div>

    <div class="sidebar-section">
      <h3>Category</h3>
      <button class="filter-chip active" data-category="all">All Categories</button>
      <button class="filter-chip" data-category="silver">Silver</button>
      <button class="filter-chip" data-category="gold">Gold</button>
      <button class="filter-chip" data-category="diamond">Diamond</button>
      <button class="filter-chip" data-category="other">Other</button>
    </div>
  </aside>

  <!-- CONTENT -->
  <div class="content">
    
    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="header-btn" id="select-all-btn" style="display:none;">Select All</button>
        <span class="stat-pill" id="item-count">Loading…</span>
      </div>
      <div class="toolbar-right">
        <div class="view-toggle">
          <button class="view-btn active" data-view="grid">⊞ Grid</button>
          <button class="view-btn" data-view="list">≡ List</button>
        </div>
      </div>
    </div>

    <!-- BROWSE MODE (GRID) -->
    <div class="mode-view active" data-mode="browse">
      <div class="grid-container" id="grid-container">
        <div class="empty-state">
          <p>No items found</p>
        </div>
      </div>
    </div>

    <!-- UPLOAD MODE -->
    <div class="mode-view" data-mode="upload" style="padding:16px; overflow-y:auto;">
      <div style="max-width:420px;">
        <h2 style="margin:0 0 16px; font-size:16px; font-weight:700;">📸 Scan & Upload</h2>
        
        <div class="field-group">
          <label class="field-label">Camera</label>
          <div class="scan-box" id="scan-box">
            <div class="scan-placeholder">Camera access needed</div>
            <div class="scan-frame"></div>
            <div class="scan-hint" id="scan-hint" style="display:none;">Align barcode in frame</div>
          </div>
          <button class="btn btn-primary" id="start-camera-btn">Start Camera</button>
        </div>

        <div class="field-group">
          <label class="field-label">Scanned Barcode</label>
          <input type="text" class="field-input" id="scanned-barcode" placeholder="Will appear here" readonly>
        </div>

        <div class="field-group">
          <label class="field-label">Bulk Upload Photos</label>
          <div class="upload-area" id="upload-area">
            <p>Drag photos here or click</p>
            <span class="upload-hint">PNG, JPG, up to 10MB each</span>
          </div>
          <input type="file" id="file-input" multiple accept="image/*" style="display:none;">
        </div>

        <div class="field-group" id="upload-list-container" style="display:none;">
          <label class="field-label">Queued Uploads</label>
          <div class="bulk-upload-list" id="upload-list"></div>
        </div>

        <button class="btn btn-primary" id="upload-all-btn" style="display:none;">Upload All Photos</button>
      </div>
    </div>
  </div>
</div>

<!-- SIDE PANEL (EDITOR) -->
<div class="side-panel" id="side-panel">
  <div class="panel-header">
    <h2 id="panel-title">Item Details</h2>
    <button class="panel-close" id="panel-close">✕</button>
  </div>

  <div class="panel-content">
    <div class="field-group">
      <label class="field-label">Barcode</label>
      <input type="text" class="field-input" id="edit-barcode" readonly>
    </div>

    <div class="field-group">
      <label class="field-label">Item Name</label>
      <input type="text" class="field-input" id="edit-name" placeholder="e.g., Silver Bangle">
    </div>

    <div class="field-group">
      <label class="field-label">Price</label>
      <input type="number" class="field-input" id="edit-price" placeholder="5500">
    </div>

    <div class="field-group">
      <label class="field-label">Category</label>
      <select class="field-select" id="edit-category">
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="diamond">Diamond</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Description</label>
      <textarea class="field-textarea" id="edit-description" placeholder="Item details…"></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">Photos</label>
      <div class="photo-grid" id="photo-grid"></div>
      <div class="upload-area" id="panel-upload-area">
        <p>Add more photos</p>
        <span class="upload-hint">Drag or click</span>
      </div>
      <input type="file" id="panel-file-input" multiple accept="image/*" style="display:none;">
    </div>
  </div>

  <div class="panel-actions">
    <button class="btn btn-primary" id="save-btn">Save</button>
    <button class="btn btn-danger" id="delete-btn">Delete</button>
  </div>
</div>

<!-- FIREBASE SETUP -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaRjbdCnfx5-C4OXQaByZMxK2r0Cu19bI",
  authDomain: "suhag-f53e4.firebaseapp.com",
  databaseURL: "https://suhag-f53e4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "suhag-f53e4",
  storageBucket: "suhag-f53e4.firebasestorage.app",
  messagingSenderId: "231258063675",
  appId: "1:231258063675:web:1c79c2a0d4d5796a6d2d1e",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

// GLOBAL STATE
let ALL_ITEMS = [];
let ACTIVE_MODE = 'browse';
let ACTIVE_FILTER = 'all';
let ACTIVE_CATEGORY = 'all';
let SEARCH_QUERY = '';
let CURRENT_EDITING = null;
let QUEUE_UPLOADS = [];

// ━━━ DOM REFS ━━━
const sidebar = document.getElementById('sidebar');
const gridContainer = document.getElementById('grid-container');
const modeButtons = document.querySelectorAll('.mode-tab');
const filterButtons = document.querySelectorAll('.filter-chip');
const categoryButtons = document.querySelectorAll('[data-category]');
const searchInput = document.getElementById('search-input');
const sidePanel = document.getElementById('side-panel');
const panelClose = document.getElementById('panel-close');
const itemCount = document.getElementById('item-count');

// ━━━ MODE SWITCHING ━━━
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    modeButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ACTIVE_MODE = btn.dataset.mode;
    updateView();
  });
});

// ━━━ FILTER & CATEGORY ━━━
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.filter) {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ACTIVE_FILTER = btn.dataset.filter;
      renderGrid();
    }
  });
});

categoryButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    categoryButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ACTIVE_CATEGORY = btn.dataset.category;
    renderGrid();
  });
});

// ━━━ SEARCH ━━━
searchInput.addEventListener('input', e => {
  SEARCH_QUERY = e.target.value.toLowerCase();
  renderGrid();
});

// ━━━ LOAD ALL ITEMS ━━━
function loadItems(){
  onValue(ref(db, 'catalogue/items'), snap => {
    const data = snap.val() || {};
    ALL_ITEMS = Object.entries(data).map(([barcode, item]) => ({
      barcode,
      name: item.name || '',
      price: item.price || 0,
      category: item.category || 'other',
      description: item.description || '',
      images: item.images || {},
      imageUrl: item.imageUrl || '',
      uploadedAt: item.uploadedAt || 0,
      updatedAt: item.updatedAt || 0,
    })).sort((a, b) => (b.uploadedAt || 0) - (a.uploadedAt || 0));
    
    updateStats();
    renderGrid();
  });
}

// ━━━ STATS & COUNTS ━━━
function updateStats(){
  const missing = ALL_ITEMS.filter(i => !i.imageUrl && Object.keys(i.images).length === 0).length;
  const incomplete = ALL_ITEMS.filter(i => !i.description || !i.name).length;
  const today = ALL_ITEMS.filter(i => {
    const d = new Date(i.updatedAt);
    const now = new Date();
    return d.toDateString() === now.toDateString();
  }).length;
  const week = ALL_ITEMS.filter(i => {
    const d = new Date(i.uploadedAt);
    const now = new Date();
    return (now - d) < 7 * 24 * 60 * 60 * 1000;
  }).length;

  document.querySelector('[data-filter="missing-photos"] .filter-badge').textContent = missing;
  document.querySelector('[data-filter="incomplete-desc"] .filter-badge').textContent = incomplete;
  document.querySelector('[data-filter="edited-today"] .filter-badge').textContent = today;
  document.querySelector('[data-filter="new-week"] .filter-badge').textContent = week;

  itemCount.textContent = `${ALL_ITEMS.length} items`;
}

// ━━━ FILTER & RENDER ━━━
function getFilteredItems(){
  let items = ALL_ITEMS;

  // Search
  if (SEARCH_QUERY) {
    items = items.filter(i => 
      i.barcode.toLowerCase().includes(SEARCH_QUERY) ||
      i.name.toLowerCase().includes(SEARCH_QUERY)
    );
  }

  // Status filter
  if (ACTIVE_FILTER !== 'all') {
    items = items.filter(i => {
      if (ACTIVE_FILTER === 'missing-photos') {
        return !i.imageUrl && Object.keys(i.images).length === 0;
      }
      if (ACTIVE_FILTER === 'incomplete-desc') {
        return !i.description || !i.name;
      }
      if (ACTIVE_FILTER === 'edited-today') {
        const d = new Date(i.updatedAt);
        const now = new Date();
        return d.toDateString() === now.toDateString();
      }
      if (ACTIVE_FILTER === 'new-week') {
        return (new Date() - new Date(i.uploadedAt)) < 7 * 24 * 60 * 60 * 1000;
      }
      return true;
    });
  }

  // Category filter
  if (ACTIVE_CATEGORY !== 'all') {
    items = items.filter(i => i.category === ACTIVE_CATEGORY);
  }

  return items;
}

function renderGrid(){
  const items = getFilteredItems();
  
  if (!items.length) {
    gridContainer.innerHTML = '<div class="empty-state"><p>No items found</p></div>';
    return;
  }

  gridContainer.innerHTML = items.map(item => `
    <div class="item-card" data-barcode="${item.barcode}">
      <div class="item-thumb">
        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="">` : '<div style="background:#F0EAD9; height:100%;"></div>'}
      </div>
      <div class="item-meta">
        <div class="item-barcode">${item.barcode}</div>
        <div class="item-name">${item.name || '(no name)'}</div>
        <div class="item-status">
          ${!item.imageUrl && Object.keys(item.images).length === 0 ? '<span class="status-label err">No Photo</span>' : ''}
          ${!item.description || !item.name ? '<span class="status-label warn">Incomplete</span>' : '<span class="status-label">Complete</span>'}
        </div>
      </div>
    </div>
  `).join('');

  // Click handlers
  document.querySelectorAll('.item-card').forEach(card => {
    card.addEventListener('click', () => openEditor(card.dataset.barcode));
  });
}

// ━━━ EDITOR ━━━
function openEditor(barcode){
  const item = ALL_ITEMS.find(i => i.barcode === barcode);
  if (!item) return;

  CURRENT_EDITING = item;
  document.getElementById('edit-barcode').value = item.barcode;
  document.getElementById('edit-name').value = item.name;
  document.getElementById('edit-price').value = item.price;
  document.getElementById('edit-category').value = item.category;
  document.getElementById('edit-description').value = item.description;

  // Photos
  const photoGrid = document.getElementById('photo-grid');
  const photos = Object.values(item.images).map(img => img.imageUrl).filter(Boolean);
  if (item.imageUrl) photos.unshift(item.imageUrl);

  photoGrid.innerHTML = photos.map((url, idx) => `
    <div class="photo-card">
      <img src="${url}" alt="">
      <button class="photo-delete" data-idx="${idx}">×</button>
      ${idx === 0 ? '<span class="photo-badge">Main</span>' : ''}
    </div>
  `).join('');

  sidePanel.classList.add('open');
  document.getElementById('panel-title').textContent = `${item.barcode} — ${item.name}`;
}

panelClose.addEventListener('click', () => {
  sidePanel.classList.remove('open');
  CURRENT_EDITING = null;
});

// ━━━ SAVE ━━━
document.getElementById('save-btn').addEventListener('click', async () => {
  if (!CURRENT_EDITING) return;

  const updates = {
    name: document.getElementById('edit-name').value,
    price: parseInt(document.getElementById('edit-price').value) || 0,
    category: document.getElementById('edit-category').value,
    description: document.getElementById('edit-description').value,
    updatedAt: Date.now(),
  };

  try {
    await update(ref(db, `catalogue/items/${CURRENT_EDITING.barcode}`), updates);
    panelClose.click();
    alert('Saved!');
  } catch (e) {
    console.error(e);
    alert('Error saving');
  }
});

// ━━━ DELETE ━━━
document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!CURRENT_EDITING || !confirm('Delete this item?')) return;

  try {
    await remove(ref(db, `catalogue/items/${CURRENT_EDITING.barcode}`));
    panelClose.click();
    alert('Deleted!');
  } catch (e) {
    console.error(e);
    alert('Error deleting');
  }
});

// ━━━ UTILITY ━━━
function updateView(){
  document.querySelectorAll('.mode-view').forEach(v => v.classList.remove('active'));
  document.querySelector(`[data-mode="${ACTIVE_MODE}"].mode-view`).classList.add('active');
}

// ━━━ INIT ━━━
loadItems();
</script>

</body>
